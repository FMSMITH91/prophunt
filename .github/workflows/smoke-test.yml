name: Server smoke test

# Boots a headless Garry's Mod dedicated server with this gamemode mounted,
# adds bots so rounds, blind time and team logic actually run, and fails if the
# gamemode does not load, if no round starts, if the run does not reach its
# end, if anything throws a Lua error while it runs, or if PH:X's integrity
# checker reports the install as broken.
#
# Not run on every push: the SteamCMD download is several GB and a cold run
# takes ~10 minutes. It runs weekly, on demand, and on pull requests that change
# this file, so an edit to it is exercised before it merges rather than by the
# next Monday cron. Run it before you push to a live server.

on:
  workflow_dispatch:
    inputs:
      map:
        description: 'Map to boot (must exist in the dedicated server install)'
        type: string
        default: 'gm_construct'
      seconds:
        description: 'How long to let the server run before shutting down (whole seconds)'
        type: string
        default: '60'
  pull_request:
    paths:
      - '.github/workflows/smoke-test.yml'
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SRCDS_DIR: ${{ github.workspace }}/srcds
  GMOD_APPID: '4020'

jobs:
  smoke:
    name: smoke
    # Pinned rather than ubuntu-latest: the package names below are 24.04's,
    # and the move to 24.04 is what removed libncurses5:i386 under this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Install 32-bit runtime libraries
        run: |
          # steamcmd and srcds_linux are 32-bit and link only libc, libm, libdl,
          # libpthread, libstdc++ and libgcc_s. These two pull in all of them.
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 lib32stdc++6

      - name: Cache key for this week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # A key that rolls weekly, restored from any older week, so the server
      # is updated incrementally instead of frozen at the first cached build.
      - name: Restore the dedicated server
        id: srcds-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SRCDS_DIR }}
          key: srcds-${{ env.GMOD_APPID }}-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: srcds-${{ env.GMOD_APPID }}-${{ runner.os }}-

      - name: Install or update SteamCMD and the Garry's Mod dedicated server
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd" "$SRCDS_DIR"
          curl -fsSL --retry 3 "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar zxf - -C "$RUNNER_TEMP/steamcmd"
          # SteamCMD fails transiently now and then; on a restored cache this
          # only downloads what changed.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/steamcmd/steamcmd.sh" +force_install_dir "$SRCDS_DIR" \
                 +login anonymous +app_update "$GMOD_APPID" +quit; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "::error::SteamCMD failed 3 times"; exit 1; fi
            echo "::warning::SteamCMD attempt $attempt failed, retrying"
          done
          test -x "$SRCDS_DIR/srcds_run"
          # Where srcds looks for the Steam client library.
          mkdir -p "$HOME/.steam/sdk32"
          ln -sf "$RUNNER_TEMP/steamcmd/linux32/steamclient.so" "$HOME/.steam/sdk32/steamclient.so"

      # Saved before anything is mounted or run, so the cache only ever holds
      # the stock server: no gamemode files from an old commit, no probe, and
      # no srcds runtime state (data/, sv.db, cfg).
      - name: Save the stock server
        if: steps.srcds-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SRCDS_DIR }}
          key: ${{ steps.srcds-cache.outputs.cache-primary-key }}

      - name: Mount the gamemode
        run: |
          # The repo root maps onto garrysmod/ - gamemodes/, lua/, materials/, ...
          cp -r repo/gamemodes repo/lua repo/materials repo/models repo/particles \
                repo/sound "$SRCDS_DIR/garrysmod/"
          ls "$SRCDS_DIR/garrysmod/gamemodes"

      - name: Install the CI probe
        id: probe
        env:
          # Via env, not ${{ }} interpolation: a workflow_dispatch input pasted
          # straight into the shell is a script-injection sink.
          SMOKE_SECONDS: ${{ inputs.seconds || '60' }}
        run: |
          probe="$SRCDS_DIR/garrysmod/lua/autorun/server/zzz_ci_smoke.lua"
          mkdir -p "$(dirname "$probe")"
          # Named zzz_ so it loads after everything else. CI-only, never committed.
          cat > "$probe" <<'LUA'
          local SMOKE_SECONDS = __SMOKE_SECONDS__

          hook.Add( "InitPostEntity", "ci_smoke_boot", function()
              -- The gamemode that actually loaded, not the one asked for: srcds
              -- falls back to another gamemode when it cannot find prop_hunt.
              MsgN( "CI_SMOKE_BOOTED gamemode=" .. tostring( GAMEMODE and GAMEMODE.FolderName ) )

              -- Bots, so rounds, blind time and deaths run instead of an empty
              -- server idling through the whole test.
              timer.Simple( 1, function()
                  for i = 1, 4 do player.CreateNextBot( "ci_bot" .. i ) end
              end )

              timer.Create( "ci_smoke_round", 1, 0, function()
                  if !GAMEMODE:InRound() then return end
                  timer.Remove( "ci_smoke_round" )
                  MsgN( "CI_SMOKE_ROUND hunters=" .. team.NumPlayers( TEAM_HUNTERS ) ..
                      " props=" .. team.NumPlayers( TEAM_PROPS ) )
              end )

              timer.Simple( SMOKE_SECONDS, function()
                  MsgN( "CI_SMOKE_DONE map=" .. game.GetMap() .. " players=" .. player.GetCount() )
                  timer.Simple( 1, function() engine.CloseServer() end )
              end )
          end )
          LUA
          # Whole seconds only, so the value can never reach the Lua or the
          # shell as anything but a number; anything else gets the default.
          secs=$SMOKE_SECONDS
          [[ "$secs" =~ ^[0-9]{1,4}$ ]] || { echo "::warning::seconds is not a whole number, using 60"; secs=60; }
          sed -i "s/__SMOKE_SECONDS__/$secs/" "$probe"
          grep -qx "local SMOKE_SECONDS = $secs" "$probe" || { echo "::error::probe substitution failed"; exit 1; }
          echo "seconds=$secs" >> "$GITHUB_OUTPUT"
          # -systemtest (see the next step) includes this file and logs an
          # [ERROR] if it is missing or empty.
          mkdir -p "$SRCDS_DIR/garrysmod/lua/includes"
          echo "-- CI smoke test: srcds -systemtest includes this file." \
            > "$SRCDS_DIR/garrysmod/lua/includes/dev_server_test.lua"
          # -systemtest also adds a bot that hibernation drops at boot. With
          # mv_change_when_no_player at its default of 1, RTV answers that
          # "server emptied" with a map vote that can change level mid-run.
          # server.cfg runs after the gamemode creates the cvar, so this
          # reaches it.
          printf '\nmv_change_when_no_player 0\n' >> "$SRCDS_DIR/garrysmod/cfg/server.cfg"

      - name: Boot the server
        env:
          SMOKE_MAP: ${{ inputs.map || 'gm_construct' }}
          SMOKE_SECONDS: ${{ steps.probe.outputs.seconds }}
        run: |
          cd "$SRCDS_DIR" || exit 1
          set +e
          # -condebug: on the runner, srcds prints only its Steam start-up
          # lines to stdout, not the game console, so the checks read the
          # engine's own log, garrysmod/console.log. That file is appended to,
          # so delete any old copy first, or its lines could pass the checks
          # for a server that never booted. The cache cannot supply one (it is
          # saved before the server first runs), but nothing else rules it out.
          rm -f garrysmod/console.log
          # +sv_hibernate_think 1: with no human players the server otherwise
          # hibernates, and no timer, Think or round code runs at all.
          # -systemtest: without it engine.CloseServer() only prints a message.
          # Its startup bot is why the probe step turns off
          # mv_change_when_no_player.
          # The timeout is a backstop for a server that hangs.
          timeout --signal=INT "$((SMOKE_SECONDS + 240))" ./srcds_run \
            -game garrysmod -console -condebug -norestart -nohltv -systemtest \
            +sv_lan 1 +maxplayers 12 +sv_hibernate_think 1 \
            +gamemode prop_hunt +map "$SMOKE_MAP" \
            2>&1 | tee "$GITHUB_WORKSPACE/console.log"
          echo "srcds exited with ${PIPESTATUS[0]}"
          # The stdout above stays in the log, for a crash before the console
          # starts. Where both carry the console, lines appear twice.
          if [ -s garrysmod/console.log ]; then
            echo "===== garrysmod/console.log (-condebug) =====" >> "$GITHUB_WORKSPACE/console.log"
            cat garrysmod/console.log >> "$GITHUB_WORKSPACE/console.log"
            echo "Last 150 lines of garrysmod/console.log:"
            tail -n 150 garrysmod/console.log
          else
            echo "::warning::srcds wrote no garrysmod/console.log, so only its stdout can be checked."
          fi

      - name: Check the gamemode loaded and ran to the end
        run: |
          grep 'CI_SMOKE_' console.log || true
          fail=0
          if ! grep -q 'CI_SMOKE_BOOTED gamemode=prop_hunt' console.log; then
            echo "::error::The server never reached InitPostEntity with prop_hunt loaded."; fail=1
          fi
          if ! grep -q 'CI_SMOKE_ROUND' console.log; then
            echo "::error::No round started with four bots on the server."; fail=1
          fi
          if ! grep -q 'CI_SMOKE_DONE' console.log; then
            echo "::error::The run never reached its end - the server hung, crashed or stopped running timers."; fail=1
          fi
          if [ "$fail" -ne 0 ]; then tail -n 150 console.log; exit 1; fi

      # Runs even when the check above failed: the Lua error is usually the cause.
      - name: Check for Lua errors
        if: ${{ !cancelled() && hashFiles('console.log') != '' }}
        run: |
          fail=0
          PATTERN='\[ERROR\]|Couldn.t include file|Timer Error|Hook .* Failed|attempt to (index|call|compare|perform|concatenate)|Tried to use a NULL entity|bad argument'
          if grep -nEi "$PATTERN" console.log; then
            echo "::error::Lua errors were logged while the server was running (see above)."; fail=1
          fi
          # PH:X's integrity checker prints this banner, then a numbered list,
          # when it decides the install is broken. It once said so about every
          # install laid out like this one (gamemodes/ copied into garrysmod/)
          # and no check above noticed.
          if grep -nF -A 8 '[PH:X Integrity Check] Error' console.log; then
            echo "::error::The PH:X integrity checker reported errors (see above)."; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "No Lua errors or integrity check errors logged."

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srcds-console-log
          path: console.log
          if-no-files-found: warn
