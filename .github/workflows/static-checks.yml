name: Static checks

on:
  push:
    paths:
      - '**.lua'
      - '.github/scripts/**'
      - '.github/workflows/static-checks.yml'
  pull_request:
    paths:
      - '**.lua'
      - '.github/scripts/**'
      - '.github/workflows/static-checks.yml'
  workflow_dispatch:

# Both checks are reports rather than gates - they annotate findings but exit 0.
# Each script has a STRICT flag to make it fail the build once its existing
# backlog is clean.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Translations vs english.lua
        run: python3 .github/scripts/check_langs.py

      # This one IS a gate. The net checker follows delegation chains, which
      # makes it permissive; these cases prove it still flags an unguarded
      # handler and still refuses to clear a chain with a gap in it.
      - name: Self-test the net.Receive checker
        run: python3 .github/scripts/test_check_net_receivers.py

      - name: Sender validation on server net.Receive handlers
        run: python3 .github/scripts/check_net_receivers.py

      # This one IS a gate. It executes the shipped functions under a stubbed
      # Garry's Mod, which is the only check here that can catch a runtime error
      # or a wrong gameplay rule - glualint and Codacy both pass code that errors
      # the instant a player touches it.
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends luajit

      - name: Lua behaviour tests
        run: .github/scripts/luatest/run.sh
