name: Static checks

# push only on master: a pull request already runs these for its branch, and
# running them on the branch push as well doubled every run and annotation.
on:
  push:
    branches: [master]
    paths:
      - '**.lua'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.lua'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# In the checks job every step is a gate except "Sender validation", which
# only reports (check_net_receivers.py exits 0 unless its STRICT flag is set).
# The later steps run even when an earlier one fails, so one red check never
# hides another's result.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gate: keys, format specifiers (number, order and type) and language
      # coverage against english.lua.
      - name: Translations vs english.lua
        run: python3 .github/scripts/check_langs.py

      # Gate. The net checker follows delegation chains, which makes it
      # permissive; these cases prove it still flags an unguarded handler and
      # still refuses to clear a chain with a gap in it.
      - name: Self-test the net.Receive checker
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test_check_net_receivers.py

      - name: Sender validation on server net.Receive handlers
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_net_receivers.py

      # Gate. It executes the shipped functions under a stubbed Garry's Mod,
      # which is the only check here that can catch a runtime error or a wrong
      # gameplay rule - glualint and Codacy both pass code that errors the
      # instant a player touches it.
      - name: Install LuaJIT
        if: ${{ !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends luajit

      - name: Lua behaviour tests
        if: ${{ !cancelled() }}
        run: .github/scripts/luatest/run.sh

  # Gate: the workflows themselves. A workflow edit is otherwise first tested
  # by running it, which for the weekly smoke test means days after merge.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: no token needed, and the result only changes when this repo does.
      - name: zizmor (GitHub Actions security lint)
        run: pipx run zizmor==1.30.1 --offline .github/workflows
