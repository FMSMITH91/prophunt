name: GLuaLint

on:
  push:
    paths:
      - '**.lua'
      - '.glualint.json'
      - '.github/workflows/glualint.yml'
  pull_request:
    paths:
      - '**.lua'
      - '.glualint.json'
      - '.github/workflows/glualint.yml'
  workflow_dispatch:

jobs:
  # Reusable workflow published by GLuaFixer itself: it downloads the latest
  # glualint release and runs `glualint lint .` over the repo, annotating any
  # findings inline on the commit/PR.
  #
  # Settings come from glualint.json in the repo root. Style rules are off
  # there and lint_warningsAreErrors is false, so only genuine syntax/parse
  # errors fail the build - warnings are reported but do not block.
  #
  # NOTE: this reusable workflow always downloads the LATEST glualint release,
  # so the version is not pinned. lint_warningsAreErrors only exists from
  # 1.30.0 onwards - on 1.29.0 it is ignored and any warning fails the build.
  # If this check ever goes red with warnings but no errors, check which
  # version the "Prepare GLuaLint" step downloaded before changing anything
  # here.
  #
  # The config is also passed explicitly rather than left to glualint's own
  # search, so the result does not depend on discovery rules.
  Lint:
    uses: FPtje/GLuaFixer/.github/workflows/glualint.yml@master
    with:
      config: "glualint.json"
